name: Build & Deploy MkDocs to S3

on:
  push:
    branches: [ main ]           # change to master or your default branch if needed
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (for WeasyPrint/Cairo etc.)
        run: |
          apt-get update -y
          apt-get install -y \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Set up Python environment
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --site-dir _site

      - name: Upload site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 1   # only needed long enough for deploy job

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploy when pushing to main (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment: production   # optional: you can create a GitHub Environment with protection rules

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Deploy to S3
        run: |
          aws s3 sync ./_site/ s3://company-policies-website --delete --cache-control "public, max-age=60"

      - name: Invalidate CloudFront cache (optional but recommended)
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"