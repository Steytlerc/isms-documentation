site_name: Company Policies
nav:
  - Home: index.md
  - ISMS Mandatory Clauses: ISP001-ISMS Mandatory Clauses.md
  - Information Security Policy: ISP003-Information Security Policy.md
  - Information Access Control Policy: ISP010-Access Control Policy.md
  - Information Files Access Rights Policy: ISP011-Information Access Rights Policy.md
  - Identity Management Policy: ISP012-Identity Management Policy.md
  - Privacy Policy: ISP013-Privacy Policy.md
  - User Registration Policy: ISP014-User Registration Policy.md
  - Network Security Policy: ISP015-Network Security Policy.md
  # Add any other existing .MD files here, e.g.:
  # - Another Policy: another-policy.md
theme:
  name: material
  palette:
    primary: indigo  # Customize as before
    accent: blue
  logo: assets/logo.png
  favicon: assets/favicon.ico
  font:
    text: Roboto
  features:
    - navigation.tabs  # Adds top tabs for multi-page nav
    - toc.follow  # Auto-scrolls the TOC sidebar as you read
    - navigation.sections  # Groups nav items if needed
markdown_extensions:
  - toc:  # Enables auto-TOC from headers; supports permalink anchors
      permalink: true  # Adds ¶ links next to headers for easy sharing
      title: Table of Contents  # Custom TOC title in sidebar
  - attr_list:  # Handles { #id .class } for custom IDs/classes on elements (fixes your .TOC-Heading)
  - tables:  # Renders | pipe tables as HTML (fixes raw +--- borders)
  - pymdownx.superfences:  # Improved fenced code blocks (useful for any policy examples)
  - pymdownx.details:  # Adds collapsible <details> sections (e.g., for glossaries)
  - admonition:  # Enables note/warning/info boxes (common in security policies)
  - footnotes:  # If your docs use [^1] style references
plugins:
  - search:  # Adds site-wide search bar (helpful for multiple policies)
extra_css:
  - styles/custom.css