site_name: Company Policies
nav:
  - Home: index.md
  - ISMS Mandatory Clauses: ISP001-ISMS Mandatory Clauses.md
  - Information Security Policy: ISP003-Information Security Policy.md
  - Information Access Control Policy: ISP010-Access Control Policy.md
  - Information Files Access Rights Policy: ISP011-Information Access Rights Policy.md
  - Identity Management Policy: ISP012-Identity Management Policy.md
  - Privacy Policy: ISP013-Privacy Policy.md
  - User Registration Policy: ISP014-User Registration Policy.md
  - Network Security Policy: ISP015-Network Security Policy.md
theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  logo: assets/2025_Primary_Logo_RGB.png  # Add your Community Fibre logo here (place in docs/assets/)
  favicon: assets/favicon.ico
  font:
    text: Poppins
  features:
    - navigation.tabs
    - toc.follow
    - navigation.sections
    - content.code.annotate  # For any code blocks
    - navigation.top  # Back-to-top button
markdown_extensions:
  - toc:
      permalink: true
      title: Table of Contents
      slugify: !!python/name:pymdownx.slugs.uslugify  # Better slugs for anchors
  - attr_list:  # For {#id .class} on headings/elements
  - tables:  # Pipe tables
  - pymdownx.superfences:  # Fenced code, diagrams
  - pymdownx.details:  # Collapsible sections (e.g., for glossaries)
  - admonition:  # Note/warning boxes
  - footnotes:  # For references
  - pymdownx.tabbed:  # Tabbed content if needed for complex sections
  - pymdownx.highlight:  # Code highlighting
  - pymdownx.inlinehilite
  - pymdownx.snippets  # Include snippets from other files if reusable
plugins:
  - search
  - pdf-export:  # For exporting to PDF (closer to original format)
      combined: true  # Single PDF output
extra_css:
  - styles/custom.css  # Your custom styles (create this file)